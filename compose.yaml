services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: larecette
      POSTGRES_PASSWORD: larecette
      POSTGRES_DB: larecette
    # 5434 on the host: a native Postgres already uses 5432 and 5433 on this machine.
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Catches every email the site sends (SMTP on 1025) and shows them at http://localhost:8025.
  # Nothing is delivered to real inboxes.
  mail:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
